name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web-app
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_ENABLE_DEMO_AUTH: 'true'
      NEXT_PUBLIC_ENABLE_MOCK_CHECKOUT: 'true'
      AUTH_SERVICE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/web-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify production security
        run: |
          npm start -- --hostname 127.0.0.1 --port 3001 > /tmp/fitai-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/auth/session > /dev/null; then break; fi
            sleep 1
          done
          npm run test:security
